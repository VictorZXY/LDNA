experiment_name: gine_pepstruct

# Model specific arguments/hyperparameters
model: GINE
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 6
  num_trans_layers: 1
  num_pred_layers: 3
  eps: 0.0
  train_eps: True
  dropout: 0.12787
  readout: attention
  residual: true

# Dataset specific arguments/hyperparameters
dataset: Peptides-struct
data_args:
  root: data/
  batch_size: 64

# Training specific arguments/hyperparameters
cuda: 3
seed: 42
train_args:
  runs: 3
  epochs: 150
  eval_interval: 10
  loss_fn: L1Loss
  optimizer: Adam
  optimizer_kwargs:
    lr: 0.000664714
    weight_decay: 3.24767e-06
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: min
  evaluator: MultiTargetMAEEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
