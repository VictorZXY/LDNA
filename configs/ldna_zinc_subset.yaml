# A/B control arm: does a 1-WL-refined canonical rank help where feature ties collapse the gate's
# delta? ZINC's single atom-type column ties most nodes, so the runtime feature rank shows a zero
# gap on 53% of edges. This arm is the untreated rank, on the ZINC-12k subset with the tuned
# ldna_zinc_rankgate shared params; single run, because the subset has no committed baseline
# number — the comparison is against ldna_zinc_subset_wl only.
experiment_name: ldna_zinc_subset

# Model specific arguments/hyperparameters
model: LDNA
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 7
  num_pre_layers: 1
  num_post_layers: 1
  num_pred_layers: 3
  dropout: 0.144427
  readout: attention
  residual: true

# Dataset specific arguments/hyperparameters
dataset: ZINC
data_args:
  root: data/zinc/
  subset: true
  batch_size: 128

# Training specific arguments/hyperparameters
cuda: 0
seed: 42
train_args:
  runs: 1
  epochs: 150
  eval_interval: 10
  loss_fn: L1Loss
  optimizer: Adam
  optimizer_kwargs:
    lr: 0.000118959
    weight_decay: 2.22642e-06
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: min
  evaluator: ZINCEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
