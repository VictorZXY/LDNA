experiment_name: dgn_brec_no_canonical

# DGN BREC canonicalization ablation: the dataset is built WITHOUT the shared nauty
# canonicalization (raw graph6 node order — the reference benchmark's own construction), isolating
# how much of DGN's committed 271.4/400 rides on the canonical order making its degenerate
# Laplacian eigenbasis consistent across the 32 permuted copies of each graph. Everything else
# matches dgn_brec.yaml. The separate root keeps the main data/brec caches untouched
# (raw/brec_v3.npy is symlinked from data/brec/raw/).
model: DGN
model_args:
  hidden_channels: 64
  out_channels: 64
  num_layers: 8
  aggregators: [mean, dir1-dx, dir1-av]
  scalers: [identity, amplification, attenuation]
  num_eig_vec: 1
  num_pre_layers: 1
  num_post_layers: 1
  dropout: 0.0
  readout: attention
  residual: true
  batch_norm: true

# Dataset specific arguments/hyperparameters
dataset: BREC
data_args:
  root: data/brec
  canonical: false

# Evaluation specific arguments/hyperparameters
cuda: 1
seed: 42
s_epsilon: true
log_dir: out/logs/
