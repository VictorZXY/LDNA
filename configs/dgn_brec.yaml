experiment_name: dgn_brec

# Model specific arguments/hyperparameters
model: DGN
model_args:
  hidden_channels: 64
  out_channels: 64
  num_layers: 8
  aggregators: [mean, dir1-dx, dir1-av]
  scalers: [identity, amplification, attenuation]
  num_eig_vec: 1
  num_pre_layers: 1
  num_post_layers: 1
  dropout: 0.0
  readout: attention
  residual: true
  batch_norm: true

# Dataset specific arguments/hyperparameters
dataset: BREC
data_args:
  root: data/brec

# Evaluation specific arguments/hyperparameters
cuda: 0
seed: 42
s_epsilon: true
log_dir: out/logs/
