# A/B treatment arm: does a nauty canonical order help where feature ties collapse the gate's delta?
# Identical to ldna_zinc_subset except data_args.canonical (nauty canonical labelling in place of the
# feature lexsort) and the rank_mode that order requires. Unlike the 1-WL arm, which broke the ties
# but destroyed the chemistry they encoded, nauty seeds from the same feature rows and only
# individualizes WITHIN a colour class, so the hypothesis is that it breaks the ties while preserving
# the chemical signal. Measured on the ZINC-subset train edges (498558), against the two other arms:
#   arm:                     feature   WL k=3   nauty
#   P(delta=0):               0.5301   0.0085   0.0000
#   corr(|delta|, differ):    +0.8154  +0.3394  +0.7122
#   AUC(|delta| -> differ):   1.0000   0.6924   0.9046
# where "differ" is "the edge's endpoints differ in atom type". Single run, because the subset has no
# committed baseline number — the comparison is against ldna_zinc_subset only.
experiment_name: ldna_zinc_subset_nauty

# Model specific arguments/hyperparameters
model: LDNA
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 7
  num_pre_layers: 1
  num_post_layers: 1
  num_pred_layers: 3
  dropout: 0.144427
  readout: attention
  residual: true
  rank_mode: position

# Dataset specific arguments/hyperparameters
dataset: ZINC
data_args:
  root: data/zinc/
  subset: true
  canonical: true
  batch_size: 128

# Training specific arguments/hyperparameters
cuda: 3
seed: 42
train_args:
  runs: 1
  epochs: 150
  eval_interval: 10
  loss_fn: L1Loss
  optimizer: Adam
  optimizer_kwargs:
    lr: 0.000118959
    weight_decay: 2.22642e-06
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: min
  evaluator: ZINCEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
