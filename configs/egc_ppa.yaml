experiment_name: egc_ppa

# Model specific arguments/hyperparameters
model: EGC
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 6
  use_multi_aggregators: True
  num_pred_layers: 3
  dropout: 0.1
  readout: attention
  residual: true

# Dataset specific arguments/hyperparameters
dataset: ogbg-ppa
data_args:
  root: data/
  batch_size: 128

# Training specific arguments/hyperparameters
cuda: 1
seed: 42
train_args:
  runs: 2
  epochs: 100
  eval_interval: 10
  loss_fn: CrossEntropyLoss
  optimizer: Adam
  optimizer_kwargs:
    lr: 1.5e-3
    weight_decay: 1.5e-6
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: max
  evaluator: AccuracyEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
