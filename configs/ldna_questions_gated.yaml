experiment_name: ldna_questions_gated

# DIAGNOSTIC gate ablation, GATED arm -- hand-picked config, NOT tuned, NOT a reported result.
# Its twin ldna_questions_ungated.yaml is identical except model_args adds `rank_mode: none`, so
# the two runs differ only in whether LDNAConv's rank gate engages; their gap measures what the
# gate contributes at node level. runs=10 maps one run to each of Questions' 10 official split
# columns (the resolver rides the per-split loader triples on the train_loader as cv_folds).
#
# No `readout` key: the resolver sets readout=None for node-level datasets, since configargparse
# stringifies nested model_args and a YAML `readout: null` would arrive as the string 'None'.
model: LDNA
model_args:
  hidden_channels: 128
  out_channels: 128
  num_layers: 3
  num_pre_layers: 1
  num_post_layers: 1
  num_pred_layers: 3
  dropout: 0.5
  residual: true

# Dataset specific arguments/hyperparameters
dataset: Questions
data_args:
  root: data/questions/

# Training specific arguments/hyperparameters
cuda: 3
mem_fraction: 0.85
seed: 42
train_args:
  runs: 10
  epochs: 1000
  eval_interval: 100
  loss_fn: BCEWithLogitsLoss
  optimizer: Adam
  optimizer_kwargs:
    lr: 3.0e-3
    weight_decay: 5.0e-4
  evaluator: ROCAUCEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
