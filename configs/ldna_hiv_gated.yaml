experiment_name: ldna_hiv_gated

# Graph-level gate ablation, GATED arm. Identical to its twin ldna_hiv_ungated.yaml except
# `rank_mode`, so the pair isolates the rank gate: same parameter count, RNG stream and
# per-seed initial weights, hence the same function at step 0. Everything else is the tuned shared
# config of ldna_hiv_rankgate.yaml. One process per seed (`runs: 1`), launched for seeds
# 42-51 as `--seed <s> --experiment_name ldna_hiv_gated_s<s>`; the arms are paired by seed.

# Model specific arguments/hyperparameters
model: LDNA
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 6
  num_pre_layers: 1
  num_post_layers: 1
  num_pred_layers: 3
  dropout: 0.143105
  readout: attention
  residual: true

# Dataset specific arguments/hyperparameters
dataset: ogbg-molhiv
data_args:
  root: data/
  batch_size: 256

# Training specific arguments/hyperparameters
cuda: 3
seed: 42
train_args:
  runs: 1
  epochs: 150
  eval_interval: 10
  loss_fn: BCEWithLogitsLoss
  optimizer: Adam
  optimizer_kwargs:
    lr: 6.29547e-05
    weight_decay: 4.51778e-06
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: max
  evaluator: OGBGraphPropPredEvaluator
  evaluator_kwargs:
    name: ogbg-molhiv
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
