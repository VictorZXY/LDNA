experiment_name: gin_brec_noncanon

# Non-spectral control for the D1 ablation (see dgn_brec_noncanon.yaml): GIN's aggregation is
# exactly permutation-invariant, so its embeddings cannot depend on the node order the ablation
# removes — if GIN stays at its committed 0/400 with clean reliability on the non-canonical build,
# the RPC regime change D1 induces (within-class copies genuinely permuted, so the near-zero
# within-class covariance behind the S+εI guard becomes a real covariance) produces no signal by
# itself, and any DGN delta can be attributed to its order-dependent eigenvector field.
# Everything else matches gin_brec.yaml.
model: GIN
model_args:
  hidden_channels: 64
  out_channels: 64
  num_layers: 8
  num_trans_layers: 1
  eps: 0.0
  train_eps: true
  dropout: 0.0
  readout: attention
  residual: true
  batch_norm: true

# Dataset specific arguments/hyperparameters
dataset: BREC
data_args:
  root: data/brec_noncanon
  canonical: false

# Evaluation specific arguments/hyperparameters
cuda: 1
seed: 42
s_epsilon: true
log_dir: out/logs/
