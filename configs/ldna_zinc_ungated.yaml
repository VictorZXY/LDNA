experiment_name: ldna_zinc_ungated

# Graph-level gate ablation, UNGATED arm. Identical to its twin ldna_zinc_gated.yaml except
# `rank_mode: none`, which keeps the gate module built but never engaged, so every LDNAConv
# is a plain sum-of-messages aggregator. Everything else is the tuned shared
# config of ldna_zinc_rankgate.yaml. One process per seed (`runs: 1`), launched for seeds
# 42-46 as `--seed <s> --experiment_name ldna_zinc_ungated_s<s>`; the arms are paired by seed.

# Model specific arguments/hyperparameters
model: LDNA
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 7
  num_pre_layers: 1
  num_post_layers: 1
  num_pred_layers: 3
  dropout: 0.144427
  readout: attention
  residual: true
  rank_mode: none

# Dataset specific arguments/hyperparameters
dataset: ZINC
data_args:
  root: data/zinc/
  batch_size: 512

# Training specific arguments/hyperparameters
cuda: 1
seed: 42
train_args:
  runs: 1
  epochs: 150
  eval_interval: 10
  loss_fn: L1Loss
  optimizer: Adam
  optimizer_kwargs:
    lr: 0.000118959
    weight_decay: 2.22642e-06
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: min
  evaluator: ZINCEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
