experiment_name: gine_zinc_nauty_rankfeat

# Canonical-position control on ZINC. Identical to gine_zinc.yaml except `rank_feature: true`, which
# adds each node's normalized canonical position (the quantity LDNA reads under `rank_mode:
# position`) to the encoded node features through a Linear(1, d) before the first conv, and
# `nauty_canonical: true`, the edge-coloured nauty order that position is read from. One process per
# seed (`runs: 1`), launched for seeds 42-46 as
# `--seed <s> --experiment_name gine_zinc_nauty_rankfeat_s<s>`.

# Model specific arguments/hyperparameters
model: GINE
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 7
  num_trans_layers: 1
  num_pred_layers: 3
  eps: 0.0
  train_eps: True
  dropout: 0.144427
  readout: attention
  residual: true
  rank_feature: true

# Dataset specific arguments/hyperparameters
dataset: ZINC
data_args:
  root: data/zinc/
  nauty_canonical: true
  batch_size: 512

# Training specific arguments/hyperparameters
cuda: 1
seed: 42
train_args:
  runs: 1
  epochs: 150
  eval_interval: 10
  loss_fn: L1Loss
  optimizer: Adam
  optimizer_kwargs:
    lr: 0.000118959
    weight_decay: 2.22642e-06
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: min
  evaluator: ZINCEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
