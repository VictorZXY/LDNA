experiment_name: dgn_ppa

# Model specific arguments/hyperparameters
model: DGN
model_args:
  hidden_channels: 256
  out_channels: 256
  num_layers: 4
  aggregators: [mean, dir1-dx, dir1-av]
  scalers: [identity, amplification, attenuation]
  num_eig_vec: 1
  num_pre_layers: 1
  num_post_layers: 1
  num_pred_layers: 3
  dropout: 0.104528
  readout: attention
  residual: true

# Dataset specific arguments/hyperparameters
dataset: ogbg-ppa
data_args:
  root: data/
  batch_size: 128

# Training specific arguments/hyperparameters
cuda: 0
seed: 42
train_args:
  runs: 2
  epochs: 100
  eval_interval: 10
  loss_fn: CrossEntropyLoss
  optimizer: Adam
  optimizer_kwargs:
    lr: 0.000917293
    weight_decay: 1.15598e-06
  scheduler: ReduceLROnPlateau
  scheduler_kwargs:
    mode: max
  evaluator: AccuracyEvaluator
checkpoint_dir: out/checkpoints/
log_dir: out/logs/
